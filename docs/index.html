<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carvo Book</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      padding: 16px;
      color: #333;
    }

    header {
      background: linear-gradient(135deg, #1a73e8 0%, #0d47a1 100%);
      color: white;
      padding: 18px 24px;
      border-radius: 12px;
      margin-bottom: 16px;
      box-shadow: 0 3px 12px rgba(26,115,232,.35);
    }
    header h1 { font-size: 22px; font-weight: 700; }
    header p  { font-size: 12px; opacity: .8; margin-top: 3px; }

    /* SETUP */
    #setup {
      background: white;
      border: 2px solid #f57c00;
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 16px;
    }
    #setup h2 { font-size: 15px; color: #e65100; margin-bottom: 12px; }
    .campo-setup { margin-bottom: 12px; }
    .campo-setup label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: #555; }
    .campo-setup input {
      width: 100%;
      padding: 9px 12px;
      border: 1.5px solid #ddd;
      border-radius: 7px;
      font-size: 13px;
      color: #333;
    }
    .campo-setup input:focus { outline: none; border-color: #1a73e8; }
    .campo-setup small { display: block; margin-top: 4px; font-size: 11px; color: #888; }

    /* CARDS */
    .card {
      background: white;
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,.07);
    }
    .card h2 {
      font-size: 14px;
      font-weight: 700;
      color: #1a73e8;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    /* BOTÕES */
    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: all .15s;
    }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn:active:not(:disabled) { transform: scale(.97); }

    .btn-red    { background: #ea4335; color: white; }
    .btn-red:hover:not(:disabled)    { background: #c62828; }
    .btn-orange { background: #f57c00; color: white; }
    .btn-orange:hover:not(:disabled) { background: #e65100; }
    .btn-green  { background: #34a853; color: white; }
    .btn-green:hover:not(:disabled)  { background: #2e7d32; }
    .btn-blue   { background: #1a73e8; color: white; }
    .btn-blue:hover:not(:disabled)   { background: #1558b0; }
    .btn-gray   { background: #f1f3f4; color: #555; }
    .btn-gray:hover:not(:disabled)   { background: #e0e0e0; }
    .btn-purple { background: #9c27b0; color: white; }
    .btn-purple:hover:not(:disabled) { background: #6a1b9a; }

    .botoes { display: flex; gap: 9px; flex-wrap: wrap; }

    /* GRAVANDO */
    #barraGravando {
      display: none;
      align-items: center;
      gap: 10px;
      background: #fce8e6;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 12px;
      font-size: 13px;
      font-weight: 600;
      color: #b71c1c;
    }
    #barraGravando.ativo { display: flex; }
    .pulse {
      width: 10px; height: 10px;
      background: #ea4335;
      border-radius: 50%;
      flex-shrink: 0;
      animation: pulsar 1s infinite;
    }
    @keyframes pulsar {
      0%,100% { opacity:1; transform:scale(1); }
      50%      { opacity:.3; transform:scale(.6); }
    }
    #cronometro { margin-left: auto; font-variant-numeric: tabular-nums; }

    /* TEXTAREA */
    #transcricao {
      width: 100%;
      min-height: 130px;
      max-height: 250px;
      border: 1.5px solid #e0e0e0;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 14px;
      line-height: 1.6;
      resize: vertical;
      background: #fafafa;
      color: #333;
      font-family: inherit;
      overflow-y: auto;
    }
    #transcricao:focus { outline: none; border-color: #1a73e8; background: white; }

    .rodape-texto {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
      font-size: 12px;
      color: #999;
    }

    /* STATUS */
    #status {
      padding: 11px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 12px;
      display: none;
    }
    #status.info      { display:block; background:#e8f0fe; color:#1557b0; }
    #status.sucesso   { display:block; background:#e6f4ea; color:#1e7e34; }
    #status.erro      { display:block; background:#fce8e6; color:#b71c1c; }
    #status.carregando{ display:block; background:#fff8e1; color:#e65100; }

    /* RESULTADO */
    #resultado { display: none; }
    #resultado hr { border: none; border-top: 1.5px solid #f0f0f0; margin: 16px 0; }
    .secao { margin-bottom: 16px; }
    .secao h3 {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 7px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .secao ul { padding-left: 18px; font-size: 14px; line-height: 1.75; color: #444; }
    .resumo-box, .texto-secao {
      font-size: 14px;
      line-height: 1.8;
      color: #444;
      background: #f8f9fa;
      padding: 11px 14px;
      border-radius: 8px;
    }
    .resumo-box  { border-left: 4px solid #1a73e8; }
    .texto-secao { border-left: 4px solid #ddd; background: #fafafa; }
    .s1 h3 { color: #1a73e8; }
    .s2 h3 { color: #34a853; }
    .s3 h3 { color: #f57c00; }
    .s4 h3 { color: #ea4335; }
    .s5 h3 { color: #9c27b0; }

    /* SPINNER */
    .spinner {
      display: inline-block;
      width: 13px; height: 13px;
      border: 2px solid #f3a500;
      border-top-color: transparent;
      border-radius: 50%;
      animation: girar .7s linear infinite;
      vertical-align: middle;
      margin-right: 5px;
    }
    @keyframes girar { to { transform: rotate(360deg); } }

    /* AÇÕES DO RESULTADO */
    #acoesResultado {
      display: none;
      gap: 9px;
      flex-wrap: wrap;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1.5px solid #f0f0f0;
    }

    @media (max-width: 480px) {
      .botoes, #acoesResultado { flex-direction: column; }
      .btn { justify-content: center; }
    }
  </style>
</head>
<body>

<header>
  <h1>Carvo Book</h1>
  <p>Transcrição e análise inteligente de reuniões — 100% no navegador</p>
</header>

<!-- CONFIGURAÇÃO -->
<div id="setup">
  <h2>⚙️ Configuração inicial</h2>

  <div class="campo-setup">
    <label>Chave da API Groq (gratuita, sem cartão)</label>
    <input type="password" id="cfgChave" placeholder="gsk_...">
    <small>
      Crie em <strong>console.groq.com</strong> → API Keys → <strong>Create API Key</strong> → sem cartão
    </small>
  </div>

  <div class="campo-setup">
    <label>Seu e-mail (para receber o relatório)</label>
    <input type="email" id="cfgEmail" placeholder="seu@email.com">
  </div>

  <div style="margin-top:14px" class="botoes">
    <button class="btn btn-green" onclick="salvarConfig()">✔ Salvar configuração</button>
    <button class="btn btn-gray"  onclick="toggleConfig()">Fechar</button>
  </div>
</div>

<!-- GRAVAÇÃO -->
<div class="card">
  <h2>🎙️ Gravação da Reunião</h2>

  <div id="barraGravando">
    <div class="pulse"></div>
    <span>Gravando... fale normalmente</span>
    <span id="cronometro">00:00</span>
  </div>

  <div class="botoes" style="margin-bottom:14px">
    <button class="btn btn-red"    id="btnGravar" onclick="iniciarGravacao()">🎙️ Iniciar</button>
    <button class="btn btn-orange" id="btnParar"  onclick="pararGravacao()" disabled>⏹️ Parar</button>
    <button class="btn btn-gray"   id="btnLimpar" onclick="limparTudo()">🗑️ Limpar</button>
    <button class="btn btn-gray"   style="margin-left:auto" onclick="toggleConfig()">⚙️ Config</button>
  </div>

  <textarea id="transcricao" placeholder="A transcrição aparecerá aqui em tempo real...&#10;&#10;Você também pode colar ou digitar o texto manualmente."></textarea>
  <div class="rodape-texto">
    <span id="contador">0 palavras</span>
    <span id="duracaoFinal" style="display:none"></span>
  </div>
</div>

<!-- RELATÓRIO -->
<div class="card">
  <h2>📊 Relatório com IA</h2>

  <div id="status"></div>

  <div class="botoes">
    <button class="btn btn-green" id="btnGerar" onclick="gerarRelatorio()">✨ Gerar Relatório</button>
  </div>

  <div id="resultado"></div>

  <div id="acoesResultado" class="botoes">
    <button class="btn btn-blue"   onclick="enviarEmail()">📧 Enviar por E-mail</button>
    <button class="btn btn-purple" onclick="baixarRelatorio()">⬇️ Baixar .txt</button>
    <button class="btn btn-gray"   onclick="copiarRelatorio()">📋 Copiar</button>
  </div>
</div>

<script>
  // ─── CONFIG ──────────────────────────────────────────────
  let cfg = {
    chave: localStorage.getItem('cb_chave') || '',
    email: localStorage.getItem('cb_email') || ''
  };

  let relatorioTexto = '';

  (function init() {
    // Só esconde o setup se a chave tiver pelo menos 20 caracteres (chave real)
    if (cfg.chave && cfg.chave.length > 20 && cfg.email) {
      document.getElementById('setup').style.display = 'none';
    }
    document.getElementById('cfgChave').value = cfg.chave;
    document.getElementById('cfgEmail').value = cfg.email;
  })();

  function salvarConfig() {
    const chave = document.getElementById('cfgChave').value.trim();
    const email = document.getElementById('cfgEmail').value.trim();
    if (!chave) { alert('Cole a chave da API Gemini.'); return; }
    if (!email) { alert('Digite seu e-mail.'); return; }
    cfg.chave = chave;
    cfg.email = email;
    localStorage.setItem('cb_chave', chave);
    localStorage.setItem('cb_email', email);
    document.getElementById('setup').style.display = 'none';
    mostrarStatus('Configuração salva com sucesso!', 'sucesso');
  }

  function toggleConfig() {
    const el = document.getElementById('setup');
    el.style.display = el.style.display === 'none' ? 'block' : 'none';
  }

  // ─── GRAVAÇÃO ────────────────────────────────────────────
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, gravando = false, timer = null, seg = 0;
  let acumulado = '';

  function iniciarGravacao() {
    if (!SpeechRec) {
      mostrarStatus('Use o Google Chrome para gravação por voz.', 'erro');
      return;
    }
    navigator.mediaDevices.getUserMedia({ audio: true })
      .then(s => { s.getTracks().forEach(t => t.stop()); comecarRec(); })
      .catch(() => mostrarStatus('Permita o microfone no Chrome e tente novamente.', 'erro'));
  }

  function comecarRec() {
    rec = new SpeechRec();
    rec.lang = 'pt-BR';
    rec.continuous = true;
    rec.interimResults = true;

    rec.onstart = () => {
      gravando = true;
      document.getElementById('barraGravando').classList.add('ativo');
      document.getElementById('btnGravar').disabled = true;
      document.getElementById('btnParar').disabled = false;
      document.getElementById('duracaoFinal').style.display = 'none';
      seg = 0;
      timer = setInterval(() => {
        seg++;
        const m = String(Math.floor(seg/60)).padStart(2,'0');
        const s = String(seg%60).padStart(2,'0');
        document.getElementById('cronometro').textContent = m+':'+s;
      }, 1000);
    };

    rec.onresult = ev => {
      let fin = '', tmp = '';
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        const t = ev.results[i][0].transcript;
        ev.results[i].isFinal ? (fin += t + ' ') : (tmp += t);
      }
      if (fin) acumulado += fin;
      const campo = document.getElementById('transcricao');
      campo.value = acumulado + tmp;
      campo.scrollTop = campo.scrollHeight;
      atualizarContador();
    };

    rec.onerror = ev => {
      if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') {
        pararGravacao();
        mostrarStatus('Microfone bloqueado. Verifique as permissões do Chrome.', 'erro');
      }
    };

    rec.onend = () => { if (gravando) rec.start(); };
    rec.start();
  }

  function pararGravacao() {
    gravando = false;
    if (rec) rec.stop();
    clearInterval(timer);
    document.getElementById('barraGravando').classList.remove('ativo');
    document.getElementById('btnGravar').disabled = false;
    document.getElementById('btnParar').disabled = true;
    acumulado = document.getElementById('transcricao').value;
    const m = String(Math.floor(seg/60)).padStart(2,'0');
    const s = String(seg%60).padStart(2,'0');
    const dur = document.getElementById('duracaoFinal');
    dur.textContent = 'Duração: ' + m + ':' + s;
    dur.style.display = 'inline';
  }

  function limparTudo() {
    pararGravacao();
    acumulado = '';
    relatorioTexto = '';
    document.getElementById('transcricao').value = '';
    document.getElementById('resultado').style.display = 'none';
    document.getElementById('acoesResultado').style.display = 'none';
    document.getElementById('status').className = '';
    document.getElementById('status').innerHTML = '';
    document.getElementById('cronometro').textContent = '00:00';
    document.getElementById('duracaoFinal').style.display = 'none';
    atualizarContador();
  }

  function atualizarContador() {
    const txt = document.getElementById('transcricao').value.trim();
    const n = txt ? txt.split(/\s+/).length : 0;
    document.getElementById('contador').textContent = n + ' palavra' + (n !== 1 ? 's' : '');
  }

  document.getElementById('transcricao').addEventListener('input', () => {
    acumulado = document.getElementById('transcricao').value;
    atualizarContador();
  });

  // ─── GEMINI ──────────────────────────────────────────────
  async function gerarRelatorio() {
    if (!cfg.chave) {
      document.getElementById('setup').style.display = 'block';
      mostrarStatus('Configure a chave da API Gemini antes de continuar.', 'erro');
      return;
    }

    const transcricao = document.getElementById('transcricao').value.trim();
    if (!transcricao || transcricao.length < 20) {
      mostrarStatus('Grave a reunião ou cole o texto antes de gerar o relatório.', 'erro');
      return;
    }

    document.getElementById('btnGerar').disabled = true;
    document.getElementById('resultado').style.display = 'none';
    document.getElementById('acoesResultado').style.display = 'none';
    mostrarStatus('<span class="spinner"></span> Analisando com IA...', 'carregando');

    const prompt = `Você é um consultor empresarial sênior especializado em gestão, estratégia e análise de reuniões corporativas em português brasileiro. Seu trabalho é transformar transcrições brutas de reuniões em relatórios executivos completos, profissionais e de alto valor analítico.

Analise a transcrição abaixo com profundidade e gere um relatório executivo detalhado. Cada seção deve ser escrita em texto corrido, com linguagem formal, clara e orientada a negócios. Seja específico — cite dados, nomes e situações mencionados na reunião quando disponíveis.

SEÇÕES DO RELATÓRIO:

1. RESUMO EXECUTIVO
Parágrafo denso de 5 a 8 linhas. Contextualize o propósito da reunião, os principais temas tratados, o tom geral da discussão e os resultados alcançados. Escreva como se fosse para um diretor que não participou da reunião.

2. CONTEXTO E PAUTA
Parágrafo explicando o contexto da reunião: por que ela ocorreu, quais eram as expectativas iniciais e qual era o problema ou oportunidade em discussão.

3. ANÁLISE DOS TEMAS DISCUTIDOS
Texto detalhado e analítico descrevendo cada tema abordado, com profundidade. Explique as posições, argumentos, divergências e convergências apresentadas pelos participantes. Mostre as conexões entre os temas.

4. DECISÕES E DELIBERAÇÕES
Texto formal descrevendo cada decisão tomada, com o racional por trás dela, quem foi responsável pela decisão e qual o impacto esperado para o negócio.

5. PLANO DE AÇÃO
Lista de ações concretas, objetivas e priorizadas. Cada item deve conter: a ação, o responsável (se mencionado) e o prazo (se mencionado).

6. ANÁLISE ESTRATÉGICA E RECOMENDAÇÕES DA IA
Parágrafo analítico profundo com: (a) avaliação crítica das decisões tomadas, (b) riscos identificados que merecem atenção, (c) oportunidades que podem ser exploradas, (d) recomendações estratégicas concretas para maximizar os resultados discutidos.

7. PONTOS DE ATENÇÃO
Parágrafo destacando riscos, inconsistências, temas não resolvidos ou pontos que precisam de acompanhamento próximo.

Transcrição:
${transcricao}

Retorne APENAS um JSON válido, sem markdown, sem texto antes ou depois, com esta estrutura exata:
{"resumo":"...","contexto":"...","temas_discutidos":"...","decisoes":"...","plano_acao":["ação 1 | Responsável: X | Prazo: Y","ação 2"],"analise_estrategica":"...","pontos_atencao":"..."}`;

    try {
      const resp = await fetch(
        'https://api.groq.com/openai/v1/chat/completions',
        {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + cfg.chave,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            model: 'llama-3.3-70b-versatile',
            messages: [{ role: 'user', content: prompt }],
            temperature: 0.2,
            max_tokens: 2048
          })
        }
      );

      if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        const msg = err.error?.message || ('Status ' + resp.status);
        if (resp.status === 401) throw new Error('Chave inválida. Verifique a chave Groq nas configurações.');
        if (resp.status === 429) throw new Error('Limite de requisições atingido. Aguarde 1 minuto e tente novamente.');
        throw new Error(msg);
      }

      const dados = await resp.json();
      const texto = dados.choices[0].message.content;
      const limpo = texto.replace(/```json\n?/g,'').replace(/```\n?/g,'').trim();
      const match = limpo.match(/\{[\s\S]*\}/);
      if (!match) throw new Error('A IA não retornou formato JSON válido. Tente novamente.');
      const rel = JSON.parse(match[0]);

      document.getElementById('btnGerar').disabled = false;
      mostrarStatus('✅ Relatório gerado com sucesso!', 'sucesso');
      exibirRelatorio(rel, transcricao);

    } catch (e) {
      document.getElementById('btnGerar').disabled = false;
      mostrarStatus('Erro: <strong>' + e.message + '</strong>', 'erro');
    }
  }

  // ─── EXIBIR ──────────────────────────────────────────────
  function exibirRelatorio(r, transcricao) {
    const data = new Date().toLocaleString('pt-BR');
    const li = arr => arr.map(i => `<li>${i}</li>`).join('');

    const passos = Array.isArray(r.plano_acao) ? r.plano_acao : [r.plano_acao];
    document.getElementById('resultado').innerHTML = `
      <hr>
      <div class="secao s1">
        <h3>📋 Resumo Executivo</h3>
        <p class="resumo-box">${r.resumo}</p>
      </div>
      <div class="secao s2">
        <h3>🗂️ Contexto e Pauta</h3>
        <p class="texto-secao">${r.contexto}</p>
      </div>
      <div class="secao s2">
        <h3>💬 Análise dos Temas Discutidos</h3>
        <p class="texto-secao">${r.temas_discutidos}</p>
      </div>
      <div class="secao s3">
        <h3>✅ Decisões e Deliberações</h3>
        <p class="texto-secao">${r.decisoes}</p>
      </div>
      <div class="secao s4">
        <h3>🚀 Plano de Ação</h3>
        <ul>${li(passos)}</ul>
      </div>
      <div class="secao s5">
        <h3>💡 Análise Estratégica e Recomendações</h3>
        <p class="texto-secao">${r.analise_estrategica}</p>
      </div>
      <div class="secao s5" style="border-left:3px solid #ea4335;padding-left:12px">
        <h3 style="color:#ea4335">⚠️ Pontos de Atenção</h3>
        <p class="texto-secao">${r.pontos_atencao}</p>
      </div>
    `;
    document.getElementById('resultado').style.display = 'block';
    document.getElementById('acoesResultado').style.display = 'flex';
    document.getElementById('resultado').scrollIntoView({ behavior: 'smooth', block: 'start' });

    // Monta texto plano para e-mail e download
    relatorioTexto =
`CARVO BOOK — RELATÓRIO DE REUNIÃO
Data: ${data}

━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
RESUMO EXECUTIVO
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
${r.resumo}

━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
CONTEXTO E PAUTA
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
${r.contexto}

━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
ANÁLISE DOS TEMAS DISCUTIDOS
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
${r.temas_discutidos}

  function enviarEmail() {
    if (!relatorioTexto) return;
    const data = new Date().toLocaleString('pt-BR');
    const assunto = encodeURIComponent('[Carvo Book] Relatório de Reunião — ' + data);
    const corpo   = encodeURIComponent(relatorioTexto);
    const para    = encodeURIComponent(cfg.email || '');
    window.location.href = `mailto:${para}?subject=${assunto}&body=${corpo}`;
  }

  function baixarRelatorio() {
    if (!relatorioTexto) return;
    const data = new Date().toISOString().slice(0,10);
    const blob = new Blob([relatorioTexto], { type: 'text/plain;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `carvo-book-${data}.txt`;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  function copiarRelatorio() {
    if (!relatorioTexto) return;
    navigator.clipboard.writeText(relatorioTexto)
      .then(() => mostrarStatus('Relatório copiado para a área de transferência!', 'sucesso'))
      .catch(() => mostrarStatus('Não foi possível copiar. Use o botão Baixar.', 'erro'));
  }

  // ─── UTILITÁRIOS ─────────────────────────────────────────
  function mostrarStatus(msg, tipo) {
    const el = document.getElementById('status');
    el.innerHTML = msg;
    el.className = tipo;
  }
</script>
