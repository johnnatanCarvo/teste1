<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carvo Book</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --carvo-dark:   #1a1a2e;
      --carvo-accent: #e8a020;
      --carvo-bg:     #f7f7f5;
      --carvo-white:  #ffffff;
      --carvo-text:   #1a1a1a;
      --carvo-sub:    #6b7280;
      --carvo-border: #e5e7eb;
      --carvo-hover:  #f3f4f6;
    }

    body {
      font-family: 'Segoe UI', -apple-system, Arial, sans-serif;
      background: var(--carvo-bg);
      min-height: 100vh;
      padding: 16px;
      color: var(--carvo-text);
      font-size: 14px;
    }

    /* HEADER */
    header {
      background: var(--carvo-dark);
      color: white;
      padding: 16px 22px;
      border-radius: 10px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .logo-mark {
      width: 38px; height: 38px;
      background: var(--carvo-accent);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 900;
      color: var(--carvo-dark);
      flex-shrink: 0; letter-spacing: -1px;
    }
    header h1 { font-size: 17px; font-weight: 700; }
    header p  { font-size: 11px; opacity: .55; margin-top: 2px; }

    /* SETUP */
    #setup {
      background: var(--carvo-white);
      border: 1.5px solid var(--carvo-accent);
      border-radius: 10px;
      padding: 18px 22px;
      margin-bottom: 14px;
    }
    #setup h2 { font-size: 13px; font-weight: 700; color: var(--carvo-dark); margin-bottom: 12px; }
    .campo-setup { margin-bottom: 10px; }
    .campo-setup label { display: block; font-size: 11px; font-weight: 600; color: var(--carvo-sub); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px; }
    .campo-setup input { width: 100%; padding: 8px 11px; border: 1.5px solid var(--carvo-border); border-radius: 6px; font-size: 13px; color: var(--carvo-text); }
    .campo-setup input:focus { outline: none; border-color: var(--carvo-accent); }
    .campo-setup small { display: block; margin-top: 3px; font-size: 11px; color: var(--carvo-sub); }

    /* CARDS */
    .card {
      background: var(--carvo-white);
      border-radius: 10px;
      padding: 18px 22px;
      margin-bottom: 12px;
      border: 1px solid var(--carvo-border);
    }
    .card h2 {
      font-size: 12px; font-weight: 700;
      color: var(--carvo-sub);
      text-transform: uppercase; letter-spacing: .6px;
      margin-bottom: 12px;
    }

    /* BOTÕES */
    .btn {
      padding: 9px 16px; border: none; border-radius: 7px;
      font-size: 13px; font-weight: 600; cursor: pointer;
      display: inline-flex; align-items: center; gap: 6px;
      transition: all .13s;
    }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn:active:not(:disabled) { transform: scale(.97); }

    .btn-primary { background: var(--carvo-dark);   color: white; }
    .btn-primary:hover:not(:disabled) { background: #0f0f1f; }
    .btn-accent  { background: var(--carvo-accent);  color: var(--carvo-dark); font-weight: 700; }
    .btn-accent:hover:not(:disabled)  { background: #d4911a; }
    .btn-danger  { background: #dc2626; color: white; }
    .btn-danger:hover:not(:disabled)  { background: #b91c1c; }
    .btn-ghost   { background: var(--carvo-hover); color: #555; border: 1px solid var(--carvo-border); }
    .btn-ghost:hover:not(:disabled)   { background: #e5e7eb; }

    .botoes { display: flex; gap: 8px; flex-wrap: wrap; }

    /* GRAVANDO */
    #barraGravando {
      display: none; align-items: center; gap: 10px;
      background: #fef2f2; border: 1px solid #fecaca;
      border-radius: 7px; padding: 9px 13px; margin-bottom: 11px;
      font-size: 13px; font-weight: 600; color: #dc2626;
    }
    #barraGravando.ativo { display: flex; }
    .pulse {
      width: 9px; height: 9px; background: #dc2626;
      border-radius: 50%; flex-shrink: 0;
      animation: pulsar 1s infinite;
    }
    @keyframes pulsar { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.3;transform:scale(.6)} }
    #cronometro { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 700; }

    /* TEXTAREA */
    #transcricao {
      width: 100%; min-height: 120px; max-height: 240px;
      border: 1.5px solid var(--carvo-border); border-radius: 7px;
      padding: 11px 13px; font-size: 14px; line-height: 1.6;
      resize: vertical; background: var(--carvo-bg);
      color: var(--carvo-text); font-family: inherit; overflow-y: auto;
    }
    #transcricao:focus { outline: none; border-color: var(--carvo-accent); background: white; }

    .rodape-texto {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 5px; font-size: 11px; color: var(--carvo-sub);
    }

    /* STATUS */
    #status {
      padding: 10px 13px; border-radius: 7px; font-size: 13px;
      font-weight: 500; margin-bottom: 11px; display: none;
    }
    #status.info      { display:block; background:#eff6ff; color:#1d4ed8; border:1px solid #bfdbfe; }
    #status.sucesso   { display:block; background:#f0fdf4; color:#15803d; border:1px solid #bbf7d0; }
    #status.erro      { display:block; background:#fef2f2; color:#dc2626; border:1px solid #fecaca; }
    #status.carregando{ display:block; background:#fffbeb; color:#b45309; border:1px solid #fde68a; }

    /* ═══════════════════════════════════════
       RELATÓRIO — estilo CraftNote melhorado
    ═══════════════════════════════════════ */
    #resultado { display: none; margin-top: 16px; }

    .doc-header {
      padding-bottom: 14px;
      border-bottom: 2px solid var(--carvo-dark);
      margin-bottom: 20px;
    }
    .doc-empresa { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--carvo-accent); background: var(--carvo-dark); display: inline-block; padding: 3px 8px; border-radius: 4px; margin-bottom: 8px; }
    .doc-titulo  { font-size: 20px; font-weight: 800; color: var(--carvo-dark); line-height: 1.2; }
    .doc-data    { font-size: 12px; color: var(--carvo-sub); margin-top: 4px; }

    .doc-secao { margin-bottom: 22px; }

    .doc-secao-label {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .7px; color: var(--carvo-sub);
      margin-bottom: 8px; padding-bottom: 5px;
      border-bottom: 1px solid var(--carvo-border);
      display: flex; align-items: center; gap: 6px;
    }
    .doc-secao-label .dot {
      width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
    }

    /* Cores dos dots por seção */
    .dot-visao     { background: var(--carvo-dark); }
    .dot-pontos    { background: #6366f1; }
    .dot-diag      { background: #0891b2; }
    .dot-decisoes  { background: #16a34a; }
    .dot-acao      { background: #ea580c; }
    .dot-impedit   { background: #dc2626; }
    .dot-financ    { background: #7c3aed; }
    .dot-rec       { background: #0e7490; }
    .dot-passos    { background: var(--carvo-accent); }
    .dot-kpi       { background: #059669; }

    .doc-paragrafo {
      font-size: 14px; line-height: 1.75; color: #374151;
    }

    .doc-bullets { list-style: none; padding: 0; }
    .doc-bullets li {
      font-size: 14px; line-height: 1.65; color: #374151;
      padding: 4px 0 4px 18px; position: relative;
      border-bottom: 1px solid #f9fafb;
    }
    .doc-bullets li:last-child { border-bottom: none; }
    .doc-bullets li::before {
      content: '•'; position: absolute; left: 0;
      color: var(--carvo-sub); font-size: 16px; line-height: 1.4;
    }

    /* Checklist para itens de ação */
    .doc-checklist { list-style: none; padding: 0; }
    .doc-checklist li {
      font-size: 13.5px; line-height: 1.55; color: #374151;
      padding: 7px 0 7px 28px; position: relative;
      border-bottom: 1px solid #f3f4f6;
    }
    .doc-checklist li:last-child { border-bottom: none; }
    .doc-checklist li::before {
      content: '☐'; position: absolute; left: 0;
      color: var(--carvo-sub); font-size: 15px; line-height: 1.4;
    }
    .doc-checklist li .meta {
      display: block; font-size: 11px; color: var(--carvo-sub);
      margin-top: 2px; font-style: italic;
    }

    /* Diagnóstico — parágrafo com borda lateral */
    .doc-diag-box {
      border-left: 3px solid #0891b2;
      padding-left: 12px;
      font-size: 14px; line-height: 1.75; color: #374151;
    }

    /* Financeiro */
    .doc-financ-box {
      border-left: 3px solid #7c3aed;
      padding-left: 12px;
      font-size: 14px; line-height: 1.75; color: #374151;
    }

    /* KPI chips */
    .kpi-grid { display: flex; flex-wrap: wrap; gap: 8px; }
    .kpi-chip {
      background: #f0fdf4; border: 1px solid #bbf7d0;
      border-radius: 6px; padding: 6px 11px;
      font-size: 12px; color: #166534; font-weight: 500;
    }

    /* SPINNER */
    .spinner {
      display: inline-block; width: 12px; height: 12px;
      border: 2px solid var(--carvo-accent); border-top-color: transparent;
      border-radius: 50%; animation: girar .7s linear infinite;
      vertical-align: middle; margin-right: 5px;
    }
    @keyframes girar { to { transform: rotate(360deg); } }

    #acoesResultado {
      display: none; gap: 8px; flex-wrap: wrap;
      margin-top: 14px; padding-top: 14px;
      border-top: 1px solid var(--carvo-border);
    }

    @media (max-width: 480px) {
      .botoes, #acoesResultado { flex-direction: column; }
      .btn { justify-content: center; }
      .kpi-grid { flex-direction: column; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo-mark">CB</div>
  <div>
    <h1>Carvo Book</h1>
    <p>Inteligência de reuniões para o varejo alimentar</p>
  </div>
</header>

<!-- SETUP -->
<div id="setup">
  <h2>⚙️ Configuração inicial</h2>
  <div class="campo-setup">
    <label>Chave da API Groq (gratuita)</label>
    <input type="password" id="cfgChave" placeholder="gsk_...">
    <small>console.groq.com → API Keys → Create API Key (sem cartão)</small>
  </div>
  <div class="campo-setup">
    <label>E-mail</label>
    <input type="email" id="cfgEmail" placeholder="seu@email.com">
  </div>
  <div class="campo-setup">
    <label>Empresa / Unidade</label>
    <input type="text" id="cfgEmpresa" placeholder="Ex: Carvo Restaurante — Unidade Centro">
  </div>
  <div style="margin-top:12px" class="botoes">
    <button class="btn btn-accent" onclick="salvarConfig()">✔ Salvar</button>
    <button class="btn btn-ghost"  onclick="toggleConfig()">Fechar</button>
  </div>
</div>

<!-- GRAVAÇÃO -->
<div class="card">
  <h2>🎙️ Gravação</h2>
  <div id="barraGravando">
    <div class="pulse"></div>
    <span>Gravando... fale normalmente</span>
    <span id="cronometro">00:00</span>
  </div>
  <div class="botoes" style="margin-bottom:12px">
    <button class="btn btn-danger" id="btnGravar" onclick="iniciarGravacao()">🎙️ Iniciar</button>
    <button class="btn btn-ghost"  id="btnParar"  onclick="pararGravacao()" disabled>⏹️ Parar</button>
    <button class="btn btn-ghost"  id="btnLimpar" onclick="limparTudo()">🗑️ Limpar</button>
    <button class="btn btn-ghost"  style="margin-left:auto" onclick="toggleConfig()">⚙️ Config</button>
  </div>
  <textarea id="transcricao" placeholder="A transcrição aparecerá aqui em tempo real...&#10;&#10;Você também pode colar ou digitar o texto manualmente."></textarea>
  <div class="rodape-texto">
    <span id="contador">0 palavras</span>
    <span id="duracaoFinal" style="display:none"></span>
  </div>
</div>

<!-- RELATÓRIO -->
<div class="card">
  <h2>📄 Relatório Executivo</h2>
  <div id="status"></div>
  <div class="botoes">
    <button class="btn btn-accent" id="btnGerar" onclick="gerarRelatorio()">✨ Gerar Relatório</button>
  </div>
  <div id="resultado"></div>
  <div id="acoesResultado" class="botoes">
    <button class="btn btn-primary" onclick="enviarEmail()">📧 E-mail</button>
    <button class="btn btn-ghost"   onclick="baixarRelatorio()">⬇️ Baixar</button>
    <button class="btn btn-ghost"   onclick="copiarRelatorio()">📋 Copiar</button>
  </div>
</div>

<script>
  // ─── CONFIG ──────────────────────────────────────────────
  let cfg = {
    chave:   localStorage.getItem('cb_chave')   || '',
    email:   localStorage.getItem('cb_email')   || '',
    empresa: localStorage.getItem('cb_empresa') || ''
  };
  let relatorioTexto = '';

  (function init() {
    if (cfg.chave && cfg.chave.length > 20 && cfg.email) {
      document.getElementById('setup').style.display = 'none';
    }
    document.getElementById('cfgChave').value   = cfg.chave;
    document.getElementById('cfgEmail').value   = cfg.email;
    document.getElementById('cfgEmpresa').value = cfg.empresa;
  })();

  function salvarConfig() {
    const chave   = document.getElementById('cfgChave').value.trim();
    const email   = document.getElementById('cfgEmail').value.trim();
    const empresa = document.getElementById('cfgEmpresa').value.trim();
    if (!chave) { alert('Cole a chave Groq.'); return; }
    if (!email) { alert('Digite seu e-mail.'); return; }
    cfg = { chave, email, empresa };
    localStorage.setItem('cb_chave',   chave);
    localStorage.setItem('cb_email',   email);
    localStorage.setItem('cb_empresa', empresa);
    document.getElementById('setup').style.display = 'none';
    mostrarStatus('Configuração salva.', 'sucesso');
  }

  function toggleConfig() {
    const el = document.getElementById('setup');
    el.style.display = el.style.display === 'none' ? 'block' : 'none';
  }

  // ─── GRAVAÇÃO ────────────────────────────────────────────
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, gravando = false, timer = null, seg = 0, acumulado = '';

  function iniciarGravacao() {
    if (!SpeechRec) { mostrarStatus('Use o Google Chrome para gravação por voz.', 'erro'); return; }
    navigator.mediaDevices.getUserMedia({ audio: true })
      .then(s => { s.getTracks().forEach(t => t.stop()); comecarRec(); })
      .catch(() => mostrarStatus('Permita o microfone no Chrome e tente novamente.', 'erro'));
  }

  function comecarRec() {
    rec = new SpeechRec();
    rec.lang = 'pt-BR'; rec.continuous = true; rec.interimResults = true;
    rec.onstart = () => {
      gravando = true;
      document.getElementById('barraGravando').classList.add('ativo');
      document.getElementById('btnGravar').disabled = true;
      document.getElementById('btnParar').disabled  = false;
      document.getElementById('duracaoFinal').style.display = 'none';
      seg = 0;
      timer = setInterval(() => {
        seg++;
        const m = String(Math.floor(seg/60)).padStart(2,'0');
        const s = String(seg%60).padStart(2,'0');
        document.getElementById('cronometro').textContent = m+':'+s;
      }, 1000);
    };
    rec.onresult = ev => {
      let fin = '', tmp = '';
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        const t = ev.results[i][0].transcript;
        ev.results[i].isFinal ? (fin += t + ' ') : (tmp += t);
      }
      if (fin) acumulado += fin;
      const campo = document.getElementById('transcricao');
      campo.value = acumulado + tmp;
      campo.scrollTop = campo.scrollHeight;
      atualizarContador();
    };
    rec.onerror = ev => {
      if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') {
        pararGravacao();
        mostrarStatus('Microfone bloqueado. Verifique as permissões do Chrome.', 'erro');
      }
    };
    rec.onend = () => { if (gravando) rec.start(); };
    rec.start();
  }

  function pararGravacao() {
    gravando = false;
    if (rec) rec.stop();
    clearInterval(timer);
    document.getElementById('barraGravando').classList.remove('ativo');
    document.getElementById('btnGravar').disabled = false;
    document.getElementById('btnParar').disabled  = true;
    acumulado = document.getElementById('transcricao').value;
    const m = String(Math.floor(seg/60)).padStart(2,'0');
    const s = String(seg%60).padStart(2,'0');
    const dur = document.getElementById('duracaoFinal');
    dur.textContent = 'Duração: ' + m + ':' + s;
    dur.style.display = 'inline';
  }

  function limparTudo() {
    pararGravacao();
    acumulado = ''; relatorioTexto = '';
    document.getElementById('transcricao').value = '';
    document.getElementById('resultado').style.display = 'none';
    document.getElementById('acoesResultado').style.display = 'none';
    document.getElementById('status').className = '';
    document.getElementById('status').innerHTML = '';
    document.getElementById('cronometro').textContent = '00:00';
    document.getElementById('duracaoFinal').style.display = 'none';
    atualizarContador();
  }

  function atualizarContador() {
    const txt = document.getElementById('transcricao').value.trim();
    const n = txt ? txt.split(/\s+/).length : 0;
    document.getElementById('contador').textContent = n + ' palavra' + (n !== 1 ? 's' : '');
  }

  document.getElementById('transcricao').addEventListener('input', () => {
    acumulado = document.getElementById('transcricao').value;
    atualizarContador();
  });

  // ─── IA ──────────────────────────────────────────────────
  async function gerarRelatorio() {
    if (!cfg.chave) {
      document.getElementById('setup').style.display = 'block';
      mostrarStatus('Configure a chave Groq antes de continuar.', 'erro');
      return;
    }
    const transcricao = document.getElementById('transcricao').value.trim();
    if (!transcricao || transcricao.length < 20) {
      mostrarStatus('Grave a reunião ou cole o texto antes de gerar o relatório.', 'erro');
      return;
    }

    document.getElementById('btnGerar').disabled = true;
    document.getElementById('resultado').style.display = 'none';
    document.getElementById('acoesResultado').style.display = 'none';
    mostrarStatus('<span class="spinner"></span> Analisando com IA...', 'carregando');

    const empresa = cfg.empresa || 'empresa';

    const systemMsg = `Você é um consultor sênior de gestão especializado em varejo alimentar (restaurantes, food service, redes de alimentação). Empresa: ${empresa}.

REGRAS ABSOLUTAS — violá-las invalida o relatório:
1. ZERO REPETIÇÃO entre seções. Cada seção entrega informação exclusiva que não aparece em nenhuma outra.
2. ZERO GENERALIDADE. Proibido: "é importante", "deve-se atentar", "é fundamental". Use fatos concretos.
3. CITE DADOS REAIS: nomes, valores, datas, ferramentas e situações exatas da transcrição.
4. ANÁLISE CRÍTICA: aponte falhas, omissões e contradições. Não valide automaticamente o que foi dito.
5. LINGUAGEM DIRETA: cada frase entrega valor. Sem rodeios.`;

    const userMsg = `Analise a transcrição e gere um relatório executivo no formato abaixo. Cada seção tem função exclusiva — leia com atenção.

VISÃO GERAL
Um único parágrafo de 4 a 6 linhas. Responde: "O que foi esta reunião?" Para um gestor que não participou. Inclua: propósito real, estado operacional do grupo, tema central e resultado. Seja denso e objetivo.

PONTOS PRINCIPAIS
Lista de bullets (máximo 7). Responde: "O que é essencial saber sobre esta reunião?" Apenas fatos e dados concretos extraídos da transcrição. Não repita o que está na visão geral — vá mais fundo nos detalhes.

DIAGNÓSTICO DA SITUAÇÃO
Parágrafo analítico curto (3 a 4 linhas). Responde: "Qual o estado real do negócio com base no que foi revelado?" Interprete os dados — não descreva a reunião. Cite indicadores de varejo alimentar quando aplicável (CMV, perdas, giro, margem). Inclua o que está saudável e o que está vulnerável.

DECISÕES
Lista de bullets. Responde: "O que foi efetivamente decidido?" Para cada decisão: o que foi decidido + avaliação crítica (a decisão foi bem fundamentada ou frágil?). Não repita discussões — só deliberações.

ITENS DE AÇÃO
Lista de checkboxes no formato: "Tarefa objetiva | Responsável: X | Prazo: Y | Prioridade: Alta/Média/Baixa". Se responsável ou prazo não foram mencionados, escreva "A definir". Ações novas — não repita as decisões.

IMPEDIMENTOS
Lista de bullets. Responde: "O que está bloqueando o progresso?" Cite impedimentos reais mencionados + impedimentos implícitos que a equipe não verbalizou mas que existem com base no contexto.

ANÁLISE FINANCEIRA
Parágrafo analítico de 3 a 4 linhas. Responde: "Qual o impacto financeiro do que foi discutido?" Estime ou calcule efeitos sobre CMV%, margem, fluxo de caixa, custo de estoque ou perdas. Se os dados não permitirem cálculo, especifique exatamente quais números precisam ser levantados.

RECOMENDAÇÕES
Lista de bullets (máximo 5). Responde: "O que o consultor recomenda além do que já foi decidido?" Recomendações originais baseadas no que ficou de fora da pauta. Cada bullet: oportunidade + ação recomendada + resultado esperado.

PRÓXIMOS PASSOS
Lista de bullets priorizados. Responde: "O que deve acontecer primeiro na semana seguinte?" Itens concretos, sequenciados por impacto. Não repita os itens de ação — são os movimentos estratégicos prioritários.

KPIs PARA MONITORAR
Lista de indicadores diretamente ligados ao que foi discutido. Formato: "Nome do KPI | Meta sugerida | Frequência". Apenas KPIs relevantes a esta reunião específica.

Transcrição:
${transcricao}

Retorne APENAS um JSON válido, sem markdown, sem texto fora do JSON:
{"visao_geral":"...","pontos_principais":["..."],"diagnostico":"...","decisoes":["..."],"itens_acao":[{"acao":"...","responsavel":"...","prazo":"...","prioridade":"..."}],"impedimentos":["..."],"analise_financeira":"...","recomendacoes":["..."],"proximos_passos":["..."],"kpis":["..."]}`;

    try {
      const resp = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + cfg.chave, 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'llama-3.3-70b-versatile',
          messages: [
            { role: 'system', content: systemMsg },
            { role: 'user',   content: userMsg   }
          ],
          temperature: 0.3,
          max_tokens: 4000
        })
      });

      if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        if (resp.status === 401) throw new Error('Chave inválida. Verifique a chave Groq nas configurações.');
        if (resp.status === 429) throw new Error('Limite atingido. Aguarde 1 minuto e tente novamente.');
        throw new Error(err.error?.message || 'Status ' + resp.status);
      }

      const dados = await resp.json();
      const texto = dados.choices[0].message.content;
      const limpo = texto.replace(/```json\n?/g,'').replace(/```\n?/g,'').trim();
      const match = limpo.match(/\{[\s\S]*\}/);
      if (!match) throw new Error('Formato inválido. Tente novamente.');
      const rel = JSON.parse(match[0]);

      document.getElementById('btnGerar').disabled = false;
      mostrarStatus('✔ Relatório gerado.', 'sucesso');
      exibirRelatorio(rel, transcricao);

    } catch (err) {
      document.getElementById('btnGerar').disabled = false;
      mostrarStatus('Erro: <strong>' + err.message + '</strong>', 'erro');
    }
  }

  // ─── EXIBIR ──────────────────────────────────────────────
  function exibirRelatorio(r, transcricao) {
    const data    = new Date().toLocaleString('pt-BR');
    const empresa = cfg.empresa || 'Carvo';

    const bullets = arr =>
      '<ul class="doc-bullets">' +
      (Array.isArray(arr) ? arr : [arr]).map(i => `<li>${i}</li>`).join('') +
      '</ul>';

    const checklist = arr => {
      const items = Array.isArray(arr) ? arr : [arr];
      return '<ul class="doc-checklist">' + items.map(item => {
        if (typeof item === 'object') {
          const meta = [
            item.responsavel && item.responsavel !== 'A definir' ? 'Resp: ' + item.responsavel : '',
            item.prazo       && item.prazo       !== 'A definir' ? 'Prazo: ' + item.prazo       : '',
            item.prioridade  ? item.prioridade : ''
          ].filter(Boolean).join(' · ');
          return `<li>${item.acao}${meta ? `<span class="meta">${meta}</span>` : ''}</li>`;
        }
        return `<li>${item}</li>`;
      }).join('') + '</ul>';
    };

    const kpiChips = arr =>
      '<div class="kpi-grid">' +
      (Array.isArray(arr) ? arr : [arr]).map(k => `<span class="kpi-chip">${k}</span>`).join('') +
      '</div>';

    const sec = (dot, label, conteudo) => `
      <div class="doc-secao">
        <div class="doc-secao-label"><span class="dot ${dot}"></span>${label}</div>
        ${conteudo}
      </div>`;

    document.getElementById('resultado').innerHTML = `
      <div class="doc-header">
        <div class="doc-empresa">${empresa}</div>
        <div class="doc-titulo">Relatório de Reunião</div>
        <div class="doc-data">${data}</div>
      </div>

      ${sec('dot-visao',    'Visão Geral',           `<p class="doc-paragrafo">${r.visao_geral}</p>`)}
      ${sec('dot-pontos',   'Pontos Principais',     bullets(r.pontos_principais))}
      ${sec('dot-diag',     'Diagnóstico da Situação', `<p class="doc-diag-box">${r.diagnostico}</p>`)}
      ${sec('dot-decisoes', 'Decisões',              bullets(r.decisoes))}
      ${sec('dot-acao',     'Itens de Ação',         checklist(r.itens_acao))}
      ${sec('dot-impedit',  'Impedimentos',          bullets(r.impedimentos))}
      ${sec('dot-financ',   'Análise Financeira',    `<p class="doc-financ-box">${r.analise_financeira}</p>`)}
      ${sec('dot-rec',      'Recomendações',         bullets(r.recomendacoes))}
      ${sec('dot-passos',   'Próximos Passos',       bullets(r.proximos_passos))}
      ${sec('dot-kpi',      'KPIs para Monitorar',   kpiChips(r.kpis))}
    `;

    document.getElementById('resultado').style.display = 'block';
    document.getElementById('acoesResultado').style.display = 'flex';
    document.getElementById('resultado').scrollIntoView({ behavior: 'smooth', block: 'start' });

    // Texto plano para download / email
    const liTxt = arr => (Array.isArray(arr) ? arr : [arr]).map((p,i) => `• ${p}`).join('\n');
    const acaoTxt = arr => (Array.isArray(arr) ? arr : [arr]).map((a,i) => {
      if (typeof a === 'object') {
        return `☐ ${a.acao}\n   Resp: ${a.responsavel} · Prazo: ${a.prazo} · ${a.prioridade}`;
      }
      return `☐ ${a}`;
    }).join('\n');

    relatorioTexto =
`CARVO BOOK — RELATÓRIO DE REUNIÃO
${empresa} · ${data}

${'─'.repeat(48)}
VISÃO GERAL
${'─'.repeat(48)}
${r.visao_geral}

${'─'.repeat(48)}
PONTOS PRINCIPAIS
${'─'.repeat(48)}
${liTxt(r.pontos_principais)}

${'─'.repeat(48)}
DIAGNÓSTICO DA SITUAÇÃO
${'─'.repeat(48)}
${r.diagnostico}

${'─'.repeat(48)}
DECISÕES
${'─'.repeat(48)}
${liTxt(r.decisoes)}

${'─'.repeat(48)}
ITENS DE AÇÃO
${'─'.repeat(48)}
${acaoTxt(r.itens_acao)}

${'─'.repeat(48)}
IMPEDIMENTOS
${'─'.repeat(48)}
${liTxt(r.impedimentos)}

${'─'.repeat(48)}
ANÁLISE FINANCEIRA
${'─'.repeat(48)}
${r.analise_financeira}

${'─'.repeat(48)}
RECOMENDAÇÕES
${'─'.repeat(48)}
${liTxt(r.recomendacoes)}

${'─'.repeat(48)}
PRÓXIMOS PASSOS
${'─'.repeat(48)}
${liTxt(r.proximos_passos)}

${'─'.repeat(48)}
KPIs PARA MONITORAR
${'─'.repeat(48)}
${liTxt(r.kpis)}

${'─'.repeat(48)}
TRANSCRIÇÃO COMPLETA
${'─'.repeat(48)}
${transcricao}

— Gerado pelo Carvo Book`;
  }

  // ─── AÇÕES ───────────────────────────────────────────────
  function enviarEmail() {
    if (!relatorioTexto) return;
    const data    = new Date().toLocaleString('pt-BR');
    const assunto = encodeURIComponent(`[Carvo Book] Relatório de Reunião — ${data}`);
    window.location.href = `mailto:${encodeURIComponent(cfg.email)}?subject=${assunto}&body=${encodeURIComponent(relatorioTexto)}`;
  }

  function baixarRelatorio() {
    if (!relatorioTexto) return;
    const data = new Date().toISOString().slice(0,10);
    const blob = new Blob([relatorioTexto], { type: 'text/plain;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `carvo-book-${data}.txt`;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  function copiarRelatorio() {
    if (!relatorioTexto) return;
    navigator.clipboard.writeText(relatorioTexto)
      .then(() => mostrarStatus('Relatório copiado.', 'sucesso'))
      .catch(() => mostrarStatus('Não foi possível copiar. Use o botão Baixar.', 'erro'));
  }

  function mostrarStatus(msg, tipo) {
    const el = document.getElementById('status');
    el.innerHTML = msg;
    el.className = tipo;
  }
</script>
