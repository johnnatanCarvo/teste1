<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carvo Book</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --carvo-dark:   #1a1a2e;
      --carvo-mid:    #16213e;
      --carvo-accent: #e8a020;
      --carvo-light:  #f5f5f0;
      --carvo-text:   #2d2d2d;
      --carvo-muted:  #6b7280;
      --carvo-border: #e5e7eb;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: var(--carvo-light);
      min-height: 100vh;
      padding: 16px;
      color: var(--carvo-text);
    }

    /* HEADER */
    header {
      background: linear-gradient(135deg, var(--carvo-dark) 0%, var(--carvo-mid) 100%);
      color: white;
      padding: 20px 26px;
      border-radius: 12px;
      margin-bottom: 16px;
      box-shadow: 0 4px 16px rgba(26,26,46,.3);
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .logo-mark {
      width: 44px; height: 44px;
      background: var(--carvo-accent);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 900;
      color: var(--carvo-dark);
      flex-shrink: 0;
      letter-spacing: -1px;
    }
    header h1 { font-size: 20px; font-weight: 700; letter-spacing: .3px; }
    header p  { font-size: 12px; opacity: .65; margin-top: 2px; }

    /* SETUP */
    #setup {
      background: white;
      border: 2px solid var(--carvo-accent);
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 16px;
    }
    #setup h2 { font-size: 14px; color: var(--carvo-dark); font-weight: 700; margin-bottom: 14px; }
    .campo-setup { margin-bottom: 12px; }
    .campo-setup label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 5px; color: var(--carvo-muted); text-transform: uppercase; letter-spacing: .4px; }
    .campo-setup input {
      width: 100%;
      padding: 9px 12px;
      border: 1.5px solid var(--carvo-border);
      border-radius: 7px;
      font-size: 13px;
      color: var(--carvo-text);
    }
    .campo-setup input:focus { outline: none; border-color: var(--carvo-accent); }
    .campo-setup small { display: block; margin-top: 4px; font-size: 11px; color: var(--carvo-muted); }

    /* CARDS */
    .card {
      background: white;
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
      border: 1px solid var(--carvo-border);
    }
    .card h2 {
      font-size: 13px;
      font-weight: 700;
      color: var(--carvo-dark);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 7px;
      text-transform: uppercase;
      letter-spacing: .5px;
    }

    /* BOTÕES */
    .btn {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: all .15s;
    }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn:active:not(:disabled) { transform: scale(.97); }

    .btn-primary { background: var(--carvo-dark);   color: white; }
    .btn-primary:hover:not(:disabled) { background: #0f0f1a; }
    .btn-accent  { background: var(--carvo-accent);  color: var(--carvo-dark); font-weight: 700; }
    .btn-accent:hover:not(:disabled)  { background: #d4911a; }
    .btn-danger  { background: #dc2626; color: white; }
    .btn-danger:hover:not(:disabled)  { background: #b91c1c; }
    .btn-ghost   { background: #f3f4f6; color: #555; border: 1px solid var(--carvo-border); }
    .btn-ghost:hover:not(:disabled)   { background: #e5e7eb; }

    .botoes { display: flex; gap: 9px; flex-wrap: wrap; }

    /* GRAVANDO */
    #barraGravando {
      display: none;
      align-items: center;
      gap: 10px;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 12px;
      font-size: 13px;
      font-weight: 600;
      color: #dc2626;
    }
    #barraGravando.ativo { display: flex; }
    .pulse {
      width: 10px; height: 10px;
      background: #dc2626;
      border-radius: 50%;
      flex-shrink: 0;
      animation: pulsar 1s infinite;
    }
    @keyframes pulsar {
      0%,100% { opacity:1; transform:scale(1); }
      50%      { opacity:.3; transform:scale(.6); }
    }
    #cronometro { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 700; }

    /* TEXTAREA */
    #transcricao {
      width: 100%;
      min-height: 130px;
      max-height: 260px;
      border: 1.5px solid var(--carvo-border);
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 14px;
      line-height: 1.65;
      resize: vertical;
      background: #fafaf9;
      color: var(--carvo-text);
      font-family: inherit;
      overflow-y: auto;
    }
    #transcricao:focus { outline: none; border-color: var(--carvo-accent); background: white; }

    .rodape-texto {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
      font-size: 11px;
      color: var(--carvo-muted);
    }

    /* STATUS */
    #status {
      padding: 11px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 12px;
      display: none;
    }
    #status.info       { display:block; background:#eff6ff; color:#1d4ed8; border:1px solid #bfdbfe; }
    #status.sucesso    { display:block; background:#f0fdf4; color:#15803d; border:1px solid #bbf7d0; }
    #status.erro       { display:block; background:#fef2f2; color:#dc2626; border:1px solid #fecaca; }
    #status.carregando { display:block; background:#fffbeb; color:#b45309; border:1px solid #fde68a; }

    /* RESULTADO */
    #resultado { display: none; }

    .rel-header {
      background: var(--carvo-dark);
      color: white;
      padding: 16px 20px;
      border-radius: 10px;
      margin-bottom: 16px;
    }
    .rel-header h2 { font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; color: var(--carvo-accent); }
    .rel-header p  { font-size: 12px; opacity: .6; margin-top: 3px; }

    .rel-secao {
      margin-bottom: 14px;
      border: 1px solid var(--carvo-border);
      border-radius: 10px;
      overflow: hidden;
    }
    .rel-secao-titulo {
      padding: 10px 16px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .6px;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .rel-secao-corpo {
      padding: 14px 16px;
      font-size: 14px;
      line-height: 1.8;
      color: #374151;
      background: white;
    }
    .rel-secao-corpo ul {
      padding-left: 18px;
      line-height: 1.9;
    }
    .rel-secao-corpo ul li { margin-bottom: 4px; }

    .t-resumo    { background: var(--carvo-dark); color: var(--carvo-accent); }
    .t-contexto  { background: #1e3a5f; color: #93c5fd; }
    .t-temas     { background: #1a3a2a; color: #86efac; }
    .t-decisoes  { background: #3a2a00; color: #fde68a; }
    .t-acao      { background: #1a2e3a; color: #7dd3fc; }
    .t-financeiro{ background: #2a1a3a; color: #c4b5fd; }
    .t-estrategia{ background: #1a3a1a; color: #a7f3d0; }
    .t-atencao   { background: #3a1a1a; color: #fca5a5; }
    .t-kpi       { background: #1a2a1a; color: #d9f99d; }

    /* SPINNER */
    .spinner {
      display: inline-block;
      width: 13px; height: 13px;
      border: 2px solid var(--carvo-accent);
      border-top-color: transparent;
      border-radius: 50%;
      animation: girar .7s linear infinite;
      vertical-align: middle;
      margin-right: 5px;
    }
    @keyframes girar { to { transform: rotate(360deg); } }

    #acoesResultado {
      display: none;
      gap: 9px;
      flex-wrap: wrap;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--carvo-border);
    }

    @media (max-width: 480px) {
      .botoes, #acoesResultado { flex-direction: column; }
      .btn { justify-content: center; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo-mark">CB</div>
  <div>
    <h1>Carvo Book</h1>
    <p>Inteligência de reuniões para o varejo alimentar</p>
  </div>
</header>

<!-- CONFIGURAÇÃO -->
<div id="setup">
  <h2>⚙️ Configuração inicial</h2>

  <div class="campo-setup">
    <label>Chave da API Groq (gratuita, sem cartão)</label>
    <input type="password" id="cfgChave" placeholder="gsk_...">
    <small>Crie em <strong>console.groq.com</strong> → API Keys → Create API Key</small>
  </div>

  <div class="campo-setup">
    <label>Seu e-mail</label>
    <input type="email" id="cfgEmail" placeholder="seu@email.com">
  </div>

  <div class="campo-setup">
    <label>Nome da empresa / unidade</label>
    <input type="text" id="cfgEmpresa" placeholder="Ex: Carvo Restaurante — Unidade Centro">
  </div>

  <div style="margin-top:14px" class="botoes">
    <button class="btn btn-accent" onclick="salvarConfig()">✔ Salvar</button>
    <button class="btn btn-ghost"  onclick="toggleConfig()">Fechar</button>
  </div>
</div>

<!-- GRAVAÇÃO -->
<div class="card">
  <h2>🎙️ Gravação da Reunião</h2>

  <div id="barraGravando">
    <div class="pulse"></div>
    <span>Gravando... fale normalmente</span>
    <span id="cronometro">00:00</span>
  </div>

  <div class="botoes" style="margin-bottom:14px">
    <button class="btn btn-danger"   id="btnGravar" onclick="iniciarGravacao()">🎙️ Iniciar</button>
    <button class="btn btn-ghost"    id="btnParar"  onclick="pararGravacao()" disabled>⏹️ Parar</button>
    <button class="btn btn-ghost"    id="btnLimpar" onclick="limparTudo()">🗑️ Limpar</button>
    <button class="btn btn-ghost"    style="margin-left:auto" onclick="toggleConfig()">⚙️ Config</button>
  </div>

  <textarea id="transcricao" placeholder="A transcrição aparecerá aqui em tempo real...&#10;&#10;Você também pode colar ou digitar o texto manualmente."></textarea>
  <div class="rodape-texto">
    <span id="contador">0 palavras</span>
    <span id="duracaoFinal" style="display:none"></span>
  </div>
</div>

<!-- RELATÓRIO -->
<div class="card">
  <h2>📊 Relatório Executivo</h2>

  <div id="status"></div>

  <div class="botoes">
    <button class="btn btn-accent" id="btnGerar" onclick="gerarRelatorio()">✨ Gerar Relatório</button>
  </div>

  <div id="resultado"></div>

  <div id="acoesResultado" class="botoes">
    <button class="btn btn-primary"  onclick="enviarEmail()">📧 Enviar por E-mail</button>
    <button class="btn btn-ghost"    onclick="baixarRelatorio()">⬇️ Baixar .txt</button>
    <button class="btn btn-ghost"    onclick="copiarRelatorio()">📋 Copiar</button>
  </div>
</div>

<script>
  // ─── CONFIG ──────────────────────────────────────────────
  let cfg = {
    chave:   localStorage.getItem('cb_chave')   || '',
    email:   localStorage.getItem('cb_email')   || '',
    empresa: localStorage.getItem('cb_empresa') || ''
  };
  let relatorioTexto = '';

  (function init() {
    if (cfg.chave && cfg.chave.length > 20 && cfg.email) {
      document.getElementById('setup').style.display = 'none';
    }
    document.getElementById('cfgChave').value   = cfg.chave;
    document.getElementById('cfgEmail').value   = cfg.email;
    document.getElementById('cfgEmpresa').value = cfg.empresa;
  })();

  function salvarConfig() {
    const chave   = document.getElementById('cfgChave').value.trim();
    const email   = document.getElementById('cfgEmail').value.trim();
    const empresa = document.getElementById('cfgEmpresa').value.trim();
    if (!chave) { alert('Cole a chave da API Groq.'); return; }
    if (!email) { alert('Digite seu e-mail.'); return; }
    cfg = { chave, email, empresa };
    localStorage.setItem('cb_chave',   chave);
    localStorage.setItem('cb_email',   email);
    localStorage.setItem('cb_empresa', empresa);
    document.getElementById('setup').style.display = 'none';
    mostrarStatus('Configuração salva.', 'sucesso');
  }

  function toggleConfig() {
    const el = document.getElementById('setup');
    el.style.display = el.style.display === 'none' ? 'block' : 'none';
  }

  // ─── GRAVAÇÃO ────────────────────────────────────────────
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, gravando = false, timer = null, seg = 0, acumulado = '';

  function iniciarGravacao() {
    if (!SpeechRec) { mostrarStatus('Use o Google Chrome para gravação por voz.', 'erro'); return; }
    navigator.mediaDevices.getUserMedia({ audio: true })
      .then(s => { s.getTracks().forEach(t => t.stop()); comecarRec(); })
      .catch(() => mostrarStatus('Permita o microfone no Chrome e tente novamente.', 'erro'));
  }

  function comecarRec() {
    rec = new SpeechRec();
    rec.lang = 'pt-BR';
    rec.continuous = true;
    rec.interimResults = true;

    rec.onstart = () => {
      gravando = true;
      document.getElementById('barraGravando').classList.add('ativo');
      document.getElementById('btnGravar').disabled = true;
      document.getElementById('btnParar').disabled  = false;
      document.getElementById('duracaoFinal').style.display = 'none';
      seg = 0;
      timer = setInterval(() => {
        seg++;
        const m = String(Math.floor(seg/60)).padStart(2,'0');
        const s = String(seg%60).padStart(2,'0');
        document.getElementById('cronometro').textContent = m+':'+s;
      }, 1000);
    };

    rec.onresult = ev => {
      let fin = '', tmp = '';
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        const t = ev.results[i][0].transcript;
        ev.results[i].isFinal ? (fin += t + ' ') : (tmp += t);
      }
      if (fin) acumulado += fin;
      const campo = document.getElementById('transcricao');
      campo.value = acumulado + tmp;
      campo.scrollTop = campo.scrollHeight;
      atualizarContador();
    };

    rec.onerror = ev => {
      if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') {
        pararGravacao();
        mostrarStatus('Microfone bloqueado. Verifique as permissões do Chrome.', 'erro');
      }
    };

    rec.onend = () => { if (gravando) rec.start(); };
    rec.start();
  }

  function pararGravacao() {
    gravando = false;
    if (rec) rec.stop();
    clearInterval(timer);
    document.getElementById('barraGravando').classList.remove('ativo');
    document.getElementById('btnGravar').disabled = false;
    document.getElementById('btnParar').disabled  = true;
    acumulado = document.getElementById('transcricao').value;
    const m = String(Math.floor(seg/60)).padStart(2,'0');
    const s = String(seg%60).padStart(2,'0');
    const dur = document.getElementById('duracaoFinal');
    dur.textContent = 'Duração: ' + m + ':' + s;
    dur.style.display = 'inline';
  }

  function limparTudo() {
    pararGravacao();
    acumulado = ''; relatorioTexto = '';
    document.getElementById('transcricao').value = '';
    document.getElementById('resultado').style.display = 'none';
    document.getElementById('acoesResultado').style.display = 'none';
    document.getElementById('status').className = '';
    document.getElementById('status').innerHTML = '';
    document.getElementById('cronometro').textContent = '00:00';
    document.getElementById('duracaoFinal').style.display = 'none';
    atualizarContador();
  }

  function atualizarContador() {
    const txt = document.getElementById('transcricao').value.trim();
    const n = txt ? txt.split(/\s+/).length : 0;
    document.getElementById('contador').textContent = n + ' palavra' + (n !== 1 ? 's' : '');
  }

  document.getElementById('transcricao').addEventListener('input', () => {
    acumulado = document.getElementById('transcricao').value;
    atualizarContador();
  });

  // ─── GROQ / IA ───────────────────────────────────────────
  async function gerarRelatorio() {
    if (!cfg.chave) {
      document.getElementById('setup').style.display = 'block';
      mostrarStatus('Configure a chave Groq antes de continuar.', 'erro');
      return;
    }

    const transcricao = document.getElementById('transcricao').value.trim();
    if (!transcricao || transcricao.length < 20) {
      mostrarStatus('Grave a reunião ou cole o texto antes de gerar o relatório.', 'erro');
      return;
    }

    document.getElementById('btnGerar').disabled = true;
    document.getElementById('resultado').style.display = 'none';
    document.getElementById('acoesResultado').style.display = 'none';
    mostrarStatus('<span class="spinner"></span> Analisando com IA...', 'carregando');

    const empresa = cfg.empresa || 'empresa';

    // REGRA CENTRAL: cada seção responde uma pergunta diferente — nenhuma repete informação de outra
    const systemMsg = `Você é um consultor sênior de gestão para negócios de varejo alimentar (restaurantes, food service, redes de alimentação).
Empresa analisada: ${empresa}.

REGRAS ABSOLUTAS DE QUALIDADE — violá-las invalida o relatório:
1. ZERO REPETIÇÃO: cada seção responde uma pergunta diferente. Se uma informação já foi dita, ela NÃO aparece em outra seção.
2. ZERO GENERALIDADE: proibido usar frases como "é importante", "deve-se atentar", "é fundamental", "a equipe deve". Substitua por afirmações específicas com dados reais da transcrição.
3. CITE O CONCRETO: use nomes, valores, percentuais, datas e situações exatas mencionadas na reunião. Se não existirem, diga explicitamente o que está faltando.
4. ANÁLISE CRÍTICA REAL: aponte falhas, omissões e contradições na discussão. Não valide automaticamente o que foi dito.
5. LINGUAGEM EXECUTIVA: direta, densa, sem rodeios. Cada frase deve entregar valor.`;

    const userMsg = `Analise a transcrição abaixo e gere um relatório executivo. Cada seção tem uma função exclusiva — leia com atenção antes de escrever.

SEÇÃO 1 — RESUMO EXECUTIVO
Pergunta que responde: "O que aconteceu nesta reunião?"
Escreva 1 parágrafo denso (6-8 linhas) para um diretor que não participou. Mencione: propósito real da reunião, o estado emocional/operacional do grupo, os 2-3 temas centrais e o resultado final. Não detalhe os temas — apenas sintetize.

SEÇÃO 2 — DIAGNÓSTICO DA SITUAÇÃO
Pergunta que responde: "Qual é o estado real do negócio com base no que foi revelado?"
NÃO repita o que foi dito no resumo. Interprete os dados, comportamentos e preocupações da reunião para diagnosticar a situação atual do negócio: onde está saudável, onde está vulnerável, o que está sendo ignorado. Use indicadores de varejo alimentar quando aplicável (CMV, giro, perdas, margem).

SEÇÃO 3 — ANÁLISE CRÍTICA DAS DISCUSSÕES
Pergunta que responde: "Como foi a qualidade da discussão? O que foi bem discutido e o que ficou raso?"
NÃO liste o que foi discutido — isso é função das outras seções. Avalie: quais argumentos foram sólidos, quais foram superficiais, o que não foi questionado e deveria ter sido, que dados importantes estavam ausentes da conversa, e se as prioridades abordadas correspondem à realidade do negócio.

SEÇÃO 4 — DECISÕES E RACIONAL
Pergunta que responde: "O que foi decidido, por quê, e essa decisão foi bem fundamentada?"
NÃO repita discussões — só o que foi efetivamente decidido. Para cada decisão: descreva a decisão, avalie criticamente se o racional foi sólido ou frágil, e aponte o risco direto daquela decisão se for mal executada.

SEÇÃO 5 — PLANO DE AÇÃO
Pergunta que responde: "Quem faz o quê, quando e com que prioridade?"
Lista de ações NOVAS — não mencione as decisões já listadas na seção 4. Formato obrigatório de cada item: "AÇÃO: [descrição objetiva] | RESPONSÁVEL: [nome ou cargo] | PRAZO: [data ou período] | PRIORIDADE: [Alta/Média/Baixa]". Se responsável ou prazo não foram mencionados, escreva "A definir".

SEÇÃO 6 — IMPACTO FINANCEIRO
Pergunta que responde: "Quais são as consequências financeiras concretas do que foi discutido e decidido?"
NÃO repita as decisões. Calcule ou estime: impacto no CMV%, na margem bruta, no fluxo de caixa de curto prazo, no custo de estoque ou no índice de perdas. Se os dados não permitirem cálculo, especifique exatamente quais números precisam ser levantados para fazer essa análise.

SEÇÃO 7 — RECOMENDAÇÕES ESTRATÉGICAS
Pergunta que responde: "O que o consultor recomenda fazer além do que já foi decidido?"
NÃO repita decisões nem ações já listadas. Apresente recomendações originais baseadas no que foi revelado na reunião mas NÃO foi abordado adequadamente. Seja específico: cite a oportunidade, a ação recomendada e o resultado esperado em termos de negócio.

SEÇÃO 8 — KPIs DE ACOMPANHAMENTO
Pergunta que responde: "Como medir se as decisões desta reunião estão gerando resultado?"
Liste apenas indicadores diretamente ligados ao que foi discutido nesta reunião. Para cada KPI: nome do indicador, meta sugerida (se possível inferir da conversa) e frequência de monitoramento.

SEÇÃO 9 — RISCOS E PONTOS CEGOS
Pergunta que responde: "O que pode dar errado e o que não foi discutido mas deveria ter sido?"
NÃO repita pontos já mencionados nas seções anteriores. Foque em: riscos de execução das decisões tomadas, temas críticos para o negócio que ficaram de fora da pauta, e contradições entre o que foi dito e a realidade do mercado de varejo alimentar.

Transcrição:
${transcricao}

Retorne APENAS um JSON válido, sem markdown, sem texto fora do JSON:
{"resumo":"...","diagnostico":"...","analise_critica":"...","decisoes":"...","plano_acao":["AÇÃO: ... | RESPONSÁVEL: ... | PRAZO: ... | PRIORIDADE: ..."],"impacto_financeiro":"...","recomendacoes":"...","kpis":["KPI: ... | Meta: ... | Frequência: ..."],"riscos":"..."}`;

    try {
      const resp = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + cfg.chave, 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'llama-3.3-70b-versatile',
          messages: [
            { role: 'system', content: systemMsg },
            { role: 'user',   content: userMsg   }
          ],
          temperature: 0.3,
          max_tokens: 4000
        })
      });

      if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        const msg = err.error?.message || ('Status ' + resp.status);
        if (resp.status === 401) throw new Error('Chave inválida. Verifique a chave Groq nas configurações.');
        if (resp.status === 429) throw new Error('Limite atingido. Aguarde 1 minuto e tente novamente.');
        throw new Error(msg);
      }

      const dados = await resp.json();
      const texto = dados.choices[0].message.content;
      const limpo = texto.replace(/```json\n?/g,'').replace(/```\n?/g,'').trim();
      const match = limpo.match(/\{[\s\S]*\}/);
      if (!match) throw new Error('Formato inválido. Tente novamente.');
      const rel = JSON.parse(match[0]);

      document.getElementById('btnGerar').disabled = false;
      mostrarStatus('✔ Relatório gerado com sucesso.', 'sucesso');
      exibirRelatorio(rel, transcricao);

    } catch (err) {
      document.getElementById('btnGerar').disabled = false;
      mostrarStatus('Erro: <strong>' + err.message + '</strong>', 'erro');
    }
  }

  // ─── EXIBIR ──────────────────────────────────────────────

      ${sec('Decisões e Racional',                 't-decisoes',   '✅', `<p>${r.decisoes}</p>`)}
      ${sec('Plano de Ação',                       't-acao',       '🚀', `<ul>${li(r.plano_acao)}</ul>`)}
      ${sec('Impacto Financeiro',                  't-financeiro', '💰', `<p>${r.impacto_financeiro}</p>`)}
      ${sec('Recomendações Estratégicas',          't-estrategia', '💡', `<p>${r.recomendacoes}</p>`)}
      ${sec('KPIs de Acompanhamento',              't-kpi',        '📈', `<ul>${li(r.kpis)}</ul>`)}
      ${sec('Riscos e Pontos Cegos',               't-atencao',    '⚠️', `<p>${r.riscos}</p>`)}
    `;

    document.getElementById('resultado').style.display = 'block';
    document.getElementById('acoesResultado').style.display = 'flex';
    document.getElementById('resultado').scrollIntoView({ behavior: 'smooth', block: 'start' });

    const liTxt = arr => (Array.isArray(arr) ? arr : [arr]).map((p,i) => `${i+1}. ${p}`).join('\n');

    relatorioTexto =
`CARVO BOOK — RELATÓRIO EXECUTIVO DE REUNIÃO
${empresa}
Data: ${data}

${r.diagnostico}

ANÁLISE CRÍTICA DAS DISCUSSÕES
${'═'.repeat(50)}
${r.analise_critica}

DECISÕES E RACIONAL
${'═'.repeat(50)}
${r.decisoes}

${'═'.repeat(50)}
PLANO DE AÇÃO
${'═'.repeat(50)}
${liTxt(r.plano_acao)}

${'═'.repeat(50)}
IMPACTO FINANCEIRO

  // ─── AÇÕES ───────────────────────────────────────────────
  function enviarEmail() {
    if (!relatorioTexto) return;
    const data    = new Date().toLocaleString('pt-BR');
    const assunto = encodeURIComponent(`[Carvo Book] Relatório de Reunião — ${data}`);
    const corpo   = encodeURIComponent(relatorioTexto);
    window.location.href = `mailto:${encodeURIComponent(cfg.email)}?subject=${assunto}&body=${corpo}`;
  }

  function baixarRelatorio() {
    if (!relatorioTexto) return;
    const data = new Date().toISOString().slice(0,10);
    const blob = new Blob([relatorioTexto], { type: 'text/plain;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `carvo-book-${data}.txt`;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  function copiarRelatorio() {
    if (!relatorioTexto) return;
    navigator.clipboard.writeText(relatorioTexto)
      .then(() => mostrarStatus('Relatório copiado.', 'sucesso'))
      .catch(() => mostrarStatus('Não foi possível copiar. Use o botão Baixar.', 'erro'));
  }

  function mostrarStatus(msg, tipo) {
    const el = document.getElementById('status');
    el.innerHTML = msg;
    el.className = tipo;
  }
</script>
